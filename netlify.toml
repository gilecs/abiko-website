[[redirects]]
  from = "/telegram"
  to = "https://t.me/+b8S7vfED-0AzOTI0"
  status = 302

# Caching: browsers keep photos, icons and fonts for 30 days, so return
# visits on slow connections don't re-download them. HTML is always
# re-checked so updates show up right away. If a photo is replaced, give
# the new file a new name.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Contact files for the digital business cards: phones need the vCard type
# to offer "Add to Contacts". Short cache so updated details show quickly.
[[headers]]
  for = "/*.vcf"
  [headers.values]
    Content-Type = "text/vcard; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Card source and print files live in the repo but aren't served publicly.
[[redirects]]
  from = "/cards/*"
  to = "/404"
  status = 404
  force = true
