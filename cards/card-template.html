<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>__TITLE__</title>
    <meta name="theme-color" content="__THEME_COLOR__">
    __HEAD_EXTRA__
    <style>
        __FONT_FACE__
        :root {
            __THEME_VARS__
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: var(--bg);
            color: var(--ink);
            font-family: var(--font);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: min(440px, 100%);
            margin: 0 auto;
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            flex-direction: column;
        }

        .top {
            background: var(--accent);
            color: var(--on-accent);
            padding: 1.25rem 1.5rem 4.75rem;
            display: flex;
            justify-content: center;
        }

        .brand-logo {
            height: 40px;
            width: auto;
            display: block;
            background: var(--logo-bg, transparent);
            border-radius: 10px;
            padding: var(--logo-pad, 0);
        }

        .wordmark {
            font-family: var(--wordmark-font);
            font-size: 1.5rem;
            letter-spacing: 0.02em;
        }

        .wordmark small {
            display: block;
            text-align: center;
            font-family: var(--font);
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .person {
            text-align: center;
            padding: 0 1.5rem;
            margin-top: -3.75rem;
        }

        .photo {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid var(--bg);
            background: var(--soft);
            display: block;
            margin: 0 auto 1rem;
        }

        h1 {
            font-size: 1.75rem;
            line-height: 1.15;
            letter-spacing: -0.01em;
        }

        .role {
            margin-top: 0.3rem;
            color: var(--muted);
        }

        .save {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: calc(100% - 3rem);
            margin: 1.5rem auto 0;
            padding: 0.95rem 1rem;
            border: none;
            border-radius: 999px;
            background: var(--accent);
            color: var(--on-accent);
            font: inherit;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.6rem;
            padding: 1rem 1.5rem 0;
        }

        .actions a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            padding: 0.85rem 0.25rem;
            border-radius: 18px;
            background: var(--soft);
            color: var(--ink);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .links {
            list-style: none;
            margin: 1.25rem 1.5rem 0;
            border-top: 1px solid var(--line);
        }

        .links a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            padding: 0.9rem 0.25rem;
            border-bottom: 1px solid var(--line);
            color: var(--ink);
            text-decoration: none;
        }

        .links small {
            display: block;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .links .arrow {
            margin-left: auto;
            color: var(--muted);
        }

        svg {
            width: 22px;
            height: 22px;
            flex: none;
        }

        footer {
            margin-top: auto;
            padding: 2rem 1.5rem 2.5rem;
            text-align: center;
            color: var(--muted);
            font-size: 0.82rem;
        }

        :focus-visible {
            outline: 3px solid #d98e2b;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <!--
        ======================================================
        EDIT THIS CARD HERE. Change the values in quotes below.
        Leave a value empty ("") to hide that button or link.
        "whatsapp": true makes the phone number open WhatsApp.
        ======================================================
    -->
    <script id="card-data" type="application/json">
__CARD_JSON__
    </script>

    <main class="card">
        <div class="top">__BRAND_MARK__</div>
        <section class="person">
            <img class="photo" id="photo" width="128" height="128" alt="">
            <h1 id="name"></h1>
            <p class="role" id="role"></p>
        </section>
        <button class="save" id="save" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
            Save contact
        </button>
        <nav class="actions" id="actions" aria-label="Contact"></nav>
        <ul class="links" id="links"></ul>
        <footer id="footer"></footer>
    </main>

    <script>
        const d = JSON.parse(document.getElementById('card-data').textContent);
        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const digits = (s) => String(s || '').replace(/[^\d+]/g, '');

        const icons = {
            phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.9 2Z"/>',
            whatsapp: '<path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4L3 21Z"/><path d="M9 9.5c.3 1.6 1.9 3.6 3.6 4.4.6.3 1.3 0 1.6-.5l.4-.6-1.6-.9-.6.6c-.8-.3-1.6-1.1-1.9-1.9l.6-.6-.9-1.6-.6.4c-.5.3-.7.9-.6 1.5Z"/>',
            email: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
            web: '<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
            linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6Z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/>',
            instagram: '<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>',
            facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3Z"/>',
            tiktok: '<path d="M16 3c.4 2.4 2 4 4.5 4.2v3.2A8 8 0 0 1 16 9v6.5A6 6 0 1 1 10 9.6v3.3a2.8 2.8 0 1 0 2.8 2.8V3H16Z"/>'
        };
        const icon = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[k]}</svg>`;

        document.title = `${d.name} | ${d.company}`;
        $('name').textContent = d.name;
        $('role').textContent = [d.title, d.company].filter(Boolean).join(' · ');

        // Photo, or initials if no photo yet
        const initials = d.name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
        const initialsSvg = `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><rect width="128" height="128" fill="${getComputedStyle(document.documentElement).getPropertyValue('--soft').trim()}"/><text x="64" y="78" font-family="Arial,sans-serif" font-size="46" font-weight="600" text-anchor="middle" fill="${getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()}">${esc(initials)}</text></svg>`)}`;
        $('photo').src = d.photo || initialsSvg;
        $('photo').alt = d.photo ? `Photo of ${d.name}` : '';

        // Quick action buttons
        const phone = digits(d.phone);
        const actions = [];
        if (phone) actions.push(`<a href="tel:${phone}">${icon('phone')}Call</a>`);
        if (phone && d.whatsapp) actions.push(`<a href="https://wa.me/${phone.replace('+', '')}" target="_blank" rel="noopener">${icon('whatsapp')}WhatsApp</a>`);
        if (d.email) actions.push(`<a href="mailto:${esc(d.email)}">${icon('email')}Email</a>`);
        if (d.website && actions.length < 3) actions.push(`<a href="${esc(d.website)}">${icon('web')}Website</a>`);
        $('actions').innerHTML = actions.join('');
        $('actions').style.gridTemplateColumns = `repeat(${Math.max(actions.length, 1)}, 1fr)`;

        // Link list
        const pretty = (u) => String(u).replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
        const links = [
            ['web', 'Website', d.website],
            ['linkedin', 'LinkedIn', d.linkedin],
            ['instagram', 'Instagram', d.instagram],
            ['facebook', 'Facebook', d.facebook],
            ['tiktok', 'TikTok', d.tiktok]
        ].filter(([, , url]) => url);
        $('links').innerHTML = links.map(([k, label, url]) =>
            `<li><a href="${esc(url)}" target="_blank" rel="noopener">${icon(k)}<span>${label}<small>${esc(pretty(url))}</small></span><span class="arrow" aria-hidden="true">›</span></a></li>`
        ).join('');

        $('footer').textContent = d.location || '';

        // Save contact: builds a vCard so the details go straight into the phone's contacts
        $('save').addEventListener('click', async () => {
            const parts = d.name.trim().split(/\s+/);
            const last = parts.length > 1 ? parts.pop() : '';
            const first = parts.join(' ');
            const lines = [
                'BEGIN:VCARD', 'VERSION:3.0',
                `N:${last};${first};;;`, `FN:${d.name}`,
                d.company && `ORG:${d.company}`,
                d.title && `TITLE:${d.title}`,
                phone && `TEL;TYPE=CELL:${phone}`,
                d.email && `EMAIL;TYPE=WORK:${d.email}`,
                d.website && `URL:${d.website}`,
                d.linkedin && `X-SOCIALPROFILE;TYPE=linkedin:${d.linkedin}`,
                d.location && `ADR;TYPE=WORK:;;;${d.location.split(',')[0].trim()};;;${(d.location.split(',')[1] || '').trim()}`,
                `NOTE:${d.company}. Card: ${location.href.split('#')[0]}`
            ];
            if (d.photo) {
                try {
                    const blob = await (await fetch(d.photo)).blob();
                    const b64 = await new Promise((ok) => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.readAsDataURL(blob); });
                    lines.push(`PHOTO;ENCODING=b;TYPE=JPEG:${b64}`);
                } catch (e) { /* save without photo */ }
            }
            lines.push('END:VCARD');
            const vcf = new Blob([lines.filter(Boolean).join('\r\n') + '\r\n'], { type: 'text/vcard;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(vcf);
            a.download = `${d.name.replace(/\s+/g, '-')}.vcf`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        });
    </script>
</body>
</html>
